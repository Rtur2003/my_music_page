[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA fallback (React Router vs Single Page App support)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Keep old domain redirects just in case
[[redirects]]
  from = "https://hasan-arthur-altuntash.netlify.app/*"
  to = "https://hasanarthuraltuntas.com.tr/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://rtur2003.netlify.app/*"
  to = "https://hasanarthuraltuntas.com.tr/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.hasanarthuraltuntas.com.tr/*"
  to = "https://hasanarthuraltuntas.com.tr/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://hasanarthuraltuntas.com.tr/*"
  to = "https://hasanarthuraltuntas.com.tr/:splat"
  status = 301
  force = true
